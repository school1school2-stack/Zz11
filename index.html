<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي القدرات اللفظي - أ/ عبدالعزيز الفيفي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --maroon: #800000; --gold: #d4af37; --bg: #fdfaf1; --white: #ffffff; --correct: #2e7d32; --wrong: #c62828; --matte-red: #B22222; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; user-select: none; }
        .quiz-card { background: var(--white); width: 100%; max-width: 900px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 10px solid var(--maroon); padding: 30px; position: relative; }
        .header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 20px; padding-bottom: 10px; }
        .header h3, .header h4 { color: var(--matte-red); margin: 5px 0; }
        input, select { width: 85%; padding: 14px; border-radius: 8px; border: 1.5px solid #ccc; font-size: 1.1rem; outline: none; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; text-align: center; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #f4f4f4; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; }
        .q-text { font-size: 1.4rem; font-weight: bold; text-align: center; margin-bottom: 25px; line-height: 1.8; color: #222; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt { padding: 18px; border: 2px solid #ececec; border-radius: 12px; cursor: pointer; text-align: center; font-size: 1.2rem; background: #fff; font-weight: 600; }
        .opt:hover { border-color: var(--gold); background: #fffcf0; }
        .correct { background: var(--correct) !important; color: white; border-color: var(--correct) !important; }
        .wrong { background: var(--wrong) !important; color: white; border-color: var(--wrong) !important; }
        .btn { background: var(--maroon); color: var(--gold); padding: 14px 50px; border: none; border-radius: 10px; cursor: pointer; font-size: 1.2rem; font-weight: bold; }
        .hidden { display: none !important; }
        #lock-screen { text-align: center; padding: 40px 20px; border: 2px dashed var(--wrong); border-radius: 15px; background: #fff5f5; }

        /* تعديل اللون ليكون أصفر خفيف جداً وهادئ */
        .reading-passage {
            background-color: #fffde7; /* أصفر كريمي فاتح جداً */
            border-right: 6px solid #f9f1a5; /* حافة متناسقة مع اللون */
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            display: block;
            text-align: right;
            font-size: 1.25rem;
            color: #444;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            line-height: 1.7;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="quiz-card">
    <div class="header">
        <h3>أ / عبدالعزيز الفيفي ✨</h3>
        <h4>ثانوية الأمير عبدالمجيد 🎓</h4>
        <h2>محاكي القدرات اللفظي - نموذج (11)</h2>
    </div>

    <div id="lock-screen" class="hidden">
        <h1 style="font-size: 3rem; margin: 0;">🚫</h1>
        <h2 style="color: var(--wrong);">محاولة غير مصرح بها!</h2>
        <div id="lock-info" style="font-size: 1.2rem; line-height: 2; color: #444;">
            <p id="lock-message"></p>
        </div>
    </div>

    <div id="start-page" style="text-align: center;">
        <p style="color: var(--maroon); font-weight: bold;">يرجى إدخال بريدك الوزاري المسجل للدخول</p>
        <input type="email" id="studentEmail" placeholder="البريد الإلكتروني الوزاري (sxxxxxxx@rb.moe.gov.sa)">
        <button id="start-btn" class="btn" onclick="verifyAndStart()">التحقق والدخول للاختبار 🚀</button>
        <p id="status-msg" style="margin-top: 15px; font-weight: bold; color: var(--gold);"></p>
    </div>

    <div id="quiz-page" class="hidden">
        <div class="nav-bar">
            <div id="q-counter" style="font-weight: bold;"></div>
            <div id="timer" style="font-weight: 900; color: var(--maroon); font-size: 1.4rem;">45</div>
        </div>
        <div id="question-text" class="q-text"></div>
        <div id="options-area" class="options-grid"></div>
        <div style="text-align: center; margin-top: 25px;">
            <button id="next-btn" class="btn hidden" onclick="nextQuestion()">السؤال التالي ⮕</button>
        </div>
    </div>

    <div id="result-page" class="hidden" style="text-align: center;">
        <h2 style="color: var(--maroon);">تم الانتهاء! نتيجتك هي:</h2>
        <div style="font-size: 4rem; font-weight: bold; margin: 20px 0; color: var(--gold);" id="score-text"></div>
    </div>
</div>

<script>
    const currentModelId = "model_11"; 
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let sName, sEmail, sClass = "1 / 6";

    async function verifyAndStart() {
        const emailInput = document.getElementById('studentEmail').value.trim().toLowerCase();
        const status = document.getElementById('status-msg');
        const btn = document.getElementById('start-btn');
        if(!emailInput.includes('@')) return alert("يرجى إدخال بريد إلكتروني صحيح.");
        btn.disabled = true;
        status.innerText = "جاري التحقق من بياناتك... ⏳";
        try {
            const allowedDoc = await db.collection("allowed_students").doc(emailInput).get();
            if (!allowedDoc.exists) {
                status.innerText = "";
                showLock("عذراً، هذا الإيميل غير مسجل في قائمة الطلاب المعتمدة لهذا الاختبار.");
                return;
            }
            const studentData = allowedDoc.data();
            sName = studentData.name;
            sEmail = emailInput;
            const resultCheck = await db.collection("student_results").where("email", "==", sEmail).where("model_id", "==", currentModelId).get();
            if (!resultCheck.empty) {
                status.innerText = "";
                showLock(`يا ${sName}، لقد قمت بأداء هذا الاختبار مسبقاً. لا يسمح بإعادة المحاولة.`);
                return;
            }
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            loadQuestion();
        } catch (error) {
            console.error(error);
            alert("حدث خطأ في الاتصال، يرجى المحاولة لاحقاً.");
            btn.disabled = false;
        }
    }

    function showLock(msg) {
        document.getElementById('start-page').classList.add('hidden');
        document.getElementById('lock-screen').classList.remove('hidden');
        document.getElementById('lock-message').innerText = msg;
    }

  const quizData = [
    // --- التناظر اللفظي (10 أسئلة) ---
    { q: "قاضي : محكمة", opts: ["لاعب : ملعب", "شجر : غابة", "فصل : مدرسة", "نجار : خشب"], ans: "لاعب : ملعب" },
    { q: "محراب : مسجد", opts: ["نافذة : غرفة", "منبر : خطبة", "صلاة : صيام", "حج : مكة"], ans: "نافذة : غرفة" },
    { q: "جناح : طائر", opts: ["شراع : سفينة", "عجلة : سيارة", "منقار : ريش", "ماء : نهر"], ans: "شراع : سفينة" },
    { q: "سيف : غمد", opts: ["خاتم : إصبع", "كتاب : حقيبة", "سكين : مطبخ", "نصل : حديد"], ans: "كتاب : حقيبة" },
    { q: "خيط : ثوب", opts: ["خرزة : سبحة", "ورقة : شجر", "كتاب : صفحة", "نواة : تمر"], ans: "خرزة : سبحة" },
    { q: "حمامة : سلام", opts: ["نخلة : رخاء", "أسد : غابة", "ثعلب : مكر", "وردة : حديقة"], ans: "ثعلب : مكر" },
    { q: "نوم : ليل", opts: ["صوم : رمضان", "شمس : نهار", "حرارة : صيف", "عمل : نهار"], ans: "عمل : نهار" },
    { q: "قائد : جيش", opts: ["مدرب : فريق", "مهندس : بناء", "مصل : إمام", "سائق : طريق"], ans: "مدرب : فريق" },
    { q: "رأس : عين", opts: ["غرفة : أثاث", "يد : أصبع", "شجر : غصن", "كتاب : ورق"], ans: "يد : أصبع" },
    { q: "ضحك : سرور", opts: ["بكاء : حزن", "شجاعة : نصر", "خوف : هروب", "قراءة : ثقافة"], ans: "بكاء : حزن" },

    // --- إكمال الجمل (10 أسئلة) ---
    { q: "كن ...... في الشدائد، ...... في الرخاء.", opts: ["صابراً - شاكراً", "قوياً - ضعيفاً", "حزيناً - فرحاً", "هادئاً - صاخباً"], ans: "صابراً - شاكراً" },
    { q: "من ...... في صغره، ...... في كبره.", opts: ["اجتهد - ساد", "لعب - فاز", "نام - استيقظ", "تعلم - خسر"], ans: "اجتهد - ساد" },
    { q: "العلم بلا عمل كـ ...... بلا ...... .", opts: ["الشجر - ثمر", "البحر - سمك", "الليل - قمر", "البيت - باب"], ans: "الشجر - ثمر" },
    { q: "لا تجادل ...... فربما لا يفرق الناس بينكما.", opts: ["الأحمق", "العالم", "الجاهل", "الكاذب"], ans: "الأحمق" },
    { q: "يعد ...... من أعظم وسائل المعرفة في عصرنا.", opts: ["الإنترنت", "التلفاز", "المذياع", "الهاتف"], ans: "الإنترنت" },
    { q: "إذا كنت في ...... فاحفظ لسانك، وإذا كنت في ...... فاحفظ عينك.", opts: ["مجلس - بيت", "صلاة - شارع", "عمل - مدرسة", "غضب - فرح"], ans: "مجلس - بيت" },
    { q: "الابتسامة ...... دافئة، ولغة ...... عالمية.", opts: ["لمسة - صامتة", "كلمة - يفهمها", "نظرة - جميلة", "روح - صادقة"], ans: "لمسة - صامتة" },
    { q: "حسن ...... يستر كثيراً من ...... .", opts: ["الخلق - العيوب", "المنظر - الأخلاق", "العمل - الأخطاء", "الكلام - الظنون"], ans: "الخلق - العيوب" },
    { q: "لا يدرك ...... إلا من ذاق ...... .", opts: ["النجاح - الفشل", "الغنى - الفقر", "العلم - الجهل", "الراحة - التعب"], ans: "النجاح - الفشل" },
    { q: "خير الكلام ما ...... و ...... .", opts: ["قلّ - دلّ", "طال - فاد", "كثر - نفع", "جمل - سحر"], ans: "قلّ - دلّ" },

    // --- الخطأ السياقي (10 أسئلة) ---
    { q: "يستطيع الإنسان أن يشتري السرير ولكن لا يستطيع شراء النوم.", opts: ["يشتري", "السرير", "يستطيع", "النوم"], ans: "يستطيع" },
    { q: "العظمة الحقيقية هي أن تكون عظيماً في تواضعك، وصغيراً في كبريائك.", opts: ["عظيماً", "تواضعك", "صغيراً", "كبريائك"], ans: "كبريائك" },
    { q: "الكلمة الطيبة تشبه الشجرة الخبيثة، جذورها قوية وفروعها في السماء.", opts: ["الطيبة", "الخبيثة", "جذورها", "السماء"], ans: "الخبيثة" },
    { q: "المتفائل يرى فرصة في كل صعوبة، والمتشائم يرى صعوبة في كل منحة.", opts: ["المتفائل", "صعوبة", "المتشائم", "منحة"], ans: "منحة" },
    { q: "الأصدقاء الحقيقيون كالمظلة، تظهر قيمتها عندما يصفو الجو.", opts: ["الحقيقيون", "كالمظلة", "قيمتها", "يصفو"], ans: "يصفو" },
    { q: "أفضل وسيلة لتعيش سعيداً هي أن تقلل من توقعاتك، وتزيد من طموحك الفاشل.", opts: ["سعيداً", "تقلل", "طموحك", "الفاشل"], ans: "الفاشل" },
    { q: "كتمان السر شيمة من شيم الضعفاء، وإفشاؤه دليل على القوة والتمكن.", opts: ["كتمان", "الضعفاء", "إفشاؤه", "القوة"], ans: "الضعفاء" },
    { q: "لا تصاحب الشرير فإن خلقه يعديك، فالصاحب ساحب نحو الفضيلة.", opts: ["الشرير", "يعديك", "ساحب", "الفضيلة"], ans: "الفضيلة" },
    { q: "من أراد النجاح فليبتعد عن الكسل، فإن العجز مفتاح الفرج.", opts: ["النجاح", "الكسل", "العجز", "الفرج"], ans: "الفرج" },
    { q: "الاعتذار عن الخطأ قوة، والاستمرار فيه حكمة لا يتقنها الكثير.", opts: ["الاعتذار", "قوة", "الاستمرار", "حكمة"], ans: "حكمة" },

    // --- استيعاب المقروء (5 أسئلة) ---
    { 
        q: "<span class='reading-passage'>أثبتت الدراسات أن النوم المبكر يساعد على تحسين الذاكرة وزيادة التركيز لدى الطلاب، كما يقلل من احتمالات الإصابة بالإرهاق المزمن.</span> نستنتج من النص أن النوم المتأخر يؤدي إلى:", 
        opts: ["زيادة التركيز", "تشتت الذاكرة", "الراحة النفسية", "النشاط الدائم"], 
        ans: "تشتت الذاكرة" 
    },
    { 
        q: "<span class='reading-passage'>تعتبر الطاقة الشمسية من أهم المصادر المتجددة، فهي طاقة نظيفة لا تلوث البيئة وتتوفر بكثرة في المناطق الصحراوية.</span> الفكرة الرئيسية للنص هي:", 
        opts: ["تلوث البيئة", "مميزات الطاقة الشمسية", "ندرة الطاقة", "العيش في الصحراء"], 
        ans: "مميزات الطاقة الشمسية" 
    },
    { 
        q: "<span class='reading-passage'>يعد الحفاظ على الوقت سر النجاح، فاليوم الذي يمضي لا يعود أبداً، ومن استثمر وقته في التعلم بلغ مراده.</span> أنسب عنوان للنص هو:", 
        opts: ["قيمة الوقت", "طرق التعلم", "النجاح السريع", "الماضي الجميل"], 
        ans: "قيمة الوقت" 
    },
    { 
        q: "<span class='reading-passage'>يُصنف الصقر ضمن الجوارح، ويمتاز بحدة بصره وقوته في الصيد، وهو رمز للعزة والقوة في الثقافة العربية.</span> من مميزات الصقر الواردة في النص:", 
        opts: ["السرعة في المشي", "حدة البصر", "العيش في مجموعات", "صغر الحجم"], 
        ans: "حدة البصر" 
    },
    { 
        q: "<span class='reading-passage'>تساعد الرياضة في بناء جسم سليم وعقل واعٍ، فهي تنشط الدورة الدموية وتزيل التوتر.</span> من الفوائد الصحية للرياضة في النص:", 
        opts: ["بناء المباني", "تنشيط الدورة الدموية", "زيادة التوتر", "النوم الطويل"], 
        ans: "تنشيط الدورة الدموية" 
    },

    // --- المفردة الشاذة (5 أسئلة) ---
    { q: "حدد المفردة الشاذة:", opts: ["موز", "برتقال", "خيار", "تفاح"], ans: "خيار" },
    { q: "حدد المفردة الشاذة:", opts: ["سيف", "درع", "رمح", "خنجر"], ans: "درع" },
    { q: "حدد المفردة الشاذة:", opts: ["مكة", "الرياض", "المنامة", "القاهرة"], ans: "مكة" },
    { q: "حدد المفردة الشاذة:", opts: ["سيارة", "طائرة", "دراجة", "سفينة"], ans: "طائرة" },
    { q: "حدد المفردة الشاذة:", opts: ["أسد", "ذئب", "نمر", "غزال"], ans: "غزال" }
];

    let currentIdx = 0, userScore = 0, timer;

    function loadQuestion() {
        if(currentIdx >= quizData.length) return finish();
        const data = quizData[currentIdx];
        document.getElementById('q-counter').innerText = `السؤال ${currentIdx+1} من ${quizData.length}`;
        
        // استخدام innerHTML لضمان ظهور التنسيق الملون
        document.getElementById('question-text').innerHTML = data.q;
        
        document.getElementById('next-btn').classList.add('hidden');
        const box = document.getElementById('options-area'); box.innerHTML = '';
        [...data.opts].sort(() => Math.random()-0.5).forEach(o => {
            const d = document.createElement('div'); d.className = 'opt'; d.innerText = o;
            d.onclick = () => {
                clearInterval(timer);
                if(o === data.ans) userScore++;
                document.querySelectorAll('.opt').forEach(el => {
                    el.onclick = null;
                    if(el.innerText === data.ans) el.classList.add('correct');
                    else if(el.innerText === o) el.classList.add('wrong');
                });
                document.getElementById('next-btn').classList.remove('hidden');
            };
            box.appendChild(d);
        });
        startTimer();
    }

    function startTimer() {
        let s = 45; document.getElementById('timer').innerText = s;
        clearInterval(timer);
        timer = setInterval(() => {
            s--; document.getElementById('timer').innerText = s;
            if(s<=0) { clearInterval(timer); nextQuestion(); }
        }, 1000);
    }

    function nextQuestion() { currentIdx++; loadQuestion(); }

    async function finish() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');
        document.getElementById('score-text').innerText = `${userScore} / ${quizData.length}`;
        await db.collection("student_results").add({
            name: sName, 
            email: sEmail,
            student_class: sClass, 
            score: userScore, 
            total: quizData.length,
            model_id: currentModelId, 
            time: firebase.firestore.FieldValue.serverTimestamp()
        });
    }
</script>
</body>
</html>
